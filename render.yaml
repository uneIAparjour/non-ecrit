services:
  - type: web
    name: non-ecrit
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALBERT_API_KEY
        sync: false
      - key: ALBERT_BASE_URL
        value: https://albert.api.etalab.gouv.fr/v1
      - key: LLM_MODEL
        value: mistralai/Mistral-Small-3.2-24B-Instruct-2506
